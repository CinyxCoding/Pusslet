# Versions verified against Maven Central / Google Maven on 2026-10-08 (latest stable).
# See docs/DECISIONS.md (ADR-003) for how they were verified and why some pairings were chosen.
[versions]
app-versionCode = "1"
app-versionName = "0.1.0"

android-compileSdk = "37"
android-targetSdk = "36"
android-minSdk = "26"

kotlin = "2.4.20"
agp = "9.4.1"
compose-multiplatform = "1.12.1"
compose-material3 = "1.9.0"
compose-material-icons = "1.7.3"
ksp = "2.3.12"

kotlinx-coroutines = "1.11.0"
