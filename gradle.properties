# Gradle
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
# iOS targets cannot be compiled on Windows/Linux hosts; they are built on the macOS CI job.
kotlin.native.ignoreDisabledTargets=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Product name. Change it here (and in AppConfig.APP_NAME in shared/core) to rebrand.
pusslet.appName=Pusslet
