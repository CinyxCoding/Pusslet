# detekt 2.x. Builds upon the default config (buildUponDefaultConfig = true); only deviations are listed.
complexity:
  LongParameterList:
    allowedFunctionParameters: 9
    allowedConstructorParameters: 12
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    allowedLines: 120
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    allowedComplexity: 25
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    allowedFunctionsPerFile: 40
    allowedFunctionsPerClass: 40
    allowedFunctionsPerInterface: 40
    allowedFunctionsPerObject: 40
    allowedFunctionsPerEnum: 20
    ignorePrivate: true
  LargeClass:
    allowedLines: 800
  NestedBlockDepth:
    allowedDepth: 6
  ComplexCondition:
    allowedConditions: 6

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 6
  ForbiddenComment:
    active: false
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 4
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3

exceptions:
  TooGenericExceptionCaught:
    exceptionNames:
      - 'Error'
      - 'Throwable'
