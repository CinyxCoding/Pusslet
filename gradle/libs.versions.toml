kotlinx-io = "0.9.1"

androidx-lifecycle = "2.11.0"
navigation3 = "1.1.2"
room = "2.8.5"
sqlite = "2.7.1"
ktor = "3.6.0"
koin = "4.2.2"
kermit = "2.2.0"
coil = "3.6.3"
